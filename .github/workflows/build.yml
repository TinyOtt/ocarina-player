name: Build APK and web page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk OcarinaPlayer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OcarinaPlayer-apk
          path: OcarinaPlayer.apk
      - name: Publish as the "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ocarina Player (latest build)
          body: Download OcarinaPlayer.apk on your phone and open it to install.
          files: OcarinaPlayer.apk
          make_latest: true
  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
